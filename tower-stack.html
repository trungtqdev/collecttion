<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#080b18">
  <title>Tòa Tháp Trọng Lực — Gravity Stacker</title>
  <style>
    :root {
      --bg: #080b18;
      --cyan: #45e7ff;
      --pink: #ff3e98;
      --gold: #ffd257;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: #fff;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      touch-action: manipulation;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #game-container {
      position: relative;
      width: min(100vw, 480px);
      height: 100dvh;
      max-height: 880px;
      overflow: hidden;
      background: #080b18;
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.7);
    }
    @media (min-width: 520px) {
      #game-container {
        border-radius: 28px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        height: min(96dvh, 860px);
      }
    }
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    /* Top Bar */
    .top-bar {
      position: absolute;
      top: calc(14px + var(--safe-top));
      left: 16px;
      right: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 20;
      pointer-events: none;
    }
    .top-bar > * { pointer-events: auto; }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 8px 14px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #cbd5e1;
      font-size: 13px;
      font-weight: 800;
      text-decoration: none;
      backdrop-filter: blur(8px);
    }
    .back-btn:hover { background: rgba(255, 255, 255, 0.18); color: #fff; }
    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 15px;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }

    /* Score Header */
    .score-hud {
      position: absolute;
      top: calc(65px + var(--safe-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 15;
      text-align: center;
      pointer-events: none;
    }
    .score-val {
      font-size: clamp(48px, 14vw, 76px);
      font-weight: 950;
      line-height: 1;
      letter-spacing: -0.04em;
      color: #fff;
      text-shadow: 0 0 25px rgba(255, 255, 255, 0.4);
    }
    .perfect-banner {
      opacity: 0;
      transform: scale(0.85);
      transition: opacity 0.2s, transform 0.2s;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.12em;
      color: var(--gold);
      text-shadow: 0 0 15px var(--gold);
      margin-top: 4px;
    }
    .perfect-banner.show {
      opacity: 1;
      transform: scale(1);
    }

    /* Modals */
    .screen-overlay {
      position: absolute;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(4, 7, 18, 0.82);
      backdrop-filter: blur(12px);
      transition: opacity 0.25s;
    }
    .screen-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .panel {
      width: min(390px, 95%);
      background: linear-gradient(160deg, #161c38, #0e1226 80%);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 26px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.8);
    }
    .panel-icon {
      font-size: 52px;
      margin-bottom: 6px;
      filter: drop-shadow(0 0 20px var(--gold));
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(30px, 8vw, 40px);
      font-weight: 950;
      letter-spacing: -0.04em;
      line-height: 1;
      background: linear-gradient(135deg, #fff, var(--gold) 50%, var(--pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      margin: 0 0 22px;
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.55;
    }
    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 22px;
    }
    .stat-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 10px 12px;
    }
    .stat-card b {
      display: block;
      font-size: 22px;
      font-weight: 900;
      color: #fff;
    }
    .stat-card span {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.1em;
      color: #94a3b8;
      text-transform: uppercase;
    }
    .primary-btn {
      width: 100%;
      padding: 15px 20px;
      border: 0;
      border-radius: 15px;
      background: linear-gradient(135deg, var(--gold), var(--pink));
      color: #050814;
      font-weight: 950;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 8px 32px rgba(255, 210, 87, 0.35);
      transition: transform 0.15s;
    }
    .primary-btn:hover { transform: translateY(-2px); }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="c"></canvas>

    <header class="top-bar">
      <a class="back-btn" href="./">
        <span aria-hidden="true">←</span> Sảnh game
      </a>
      <button id="soundBtn" class="icon-btn" title="Bật/Tắt âm thanh">🔊</button>
    </header>

    <div class="score-hud">
      <div class="score-val" id="scoreEl">0</div>
      <div class="perfect-banner" id="perfectBanner">HOÀN HẢO! +COMBO</div>
    </div>

    <!-- Start Modal -->
    <div id="startModal" class="screen-overlay">
      <div class="panel">
        <div class="panel-icon">🏛️</div>
        <h1>TÒA THÁP<br>TRỌNG LỰC</h1>
        <p class="subtitle">Chạm đúng nhịp để xếp từng tầng tháp vươn tới vũ trụ. Đặt hoàn hảo để giữ nguyên kích thước khối!</p>
        <div class="stats-row">
          <div class="stat-card">
            <b id="startBest">0</b>
            <span>KỶ LỤC TẦNG</span>
          </div>
          <div class="stat-card">
            <b id="startCombo">x0</b>
            <span>CHUỖI HOÀN HẢO</span>
          </div>
        </div>
        <button id="startBtn" class="primary-btn">CHƠI NGAY</button>
      </div>
    </div>

    <!-- Game Over Modal -->
    <div id="endModal" class="screen-overlay hidden">
      <div class="panel">
        <div class="panel-icon">💥</div>
        <h2 style="font-size: 32px; margin: 0 0 6px;">THÁP NGHIÊNG RỒI!</h2>
        <p style="margin: 0 0 16px; font-size: 12px; color: #94a3b8;" id="newBestLabel"></p>
        <div class="stats-row">
          <div class="stat-card">
            <b id="endScore">0</b>
            <span>TẦNG ĐẠT ĐƯỢC</span>
          </div>
          <div class="stat-card">
            <b id="endBest">0</b>
            <span>KỶ LỤC</span>
          </div>
          <div class="stat-card">
            <b id="endPerfects">0</b>
            <span>HOÀN HẢO</span>
          </div>
          <div class="stat-card">
            <b id="endMaxStreak">x0</b>
            <span>CHUỖI CAO NHẤT</span>
          </div>
        </div>
        <button id="retryBtn" class="primary-btn">XÂY LẠI TỪ ĐẦU</button>
      </div>
    </div>
  </div>

  <script>
  (() => {
    'use strict';

    // --- Web Audio Synth ---
    class StackAudio {
      constructor() {
        this.ctx = null;
        this.muted = false;
        try { this.muted = localStorage.getItem('towerStackMuted') === '1'; } catch (_) {}
      }

      init() {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) this.ctx = new AC();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playStackChime(tier = 0, isPerfect = false) {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const baseNotes = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99, 880.00, 1046.50];
        const freq = baseNotes[tier % baseNotes.length];

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = isPerfect ? 'triangle' : 'sine';
        osc.frequency.setValueAtTime(freq, now);

        gain.gain.setValueAtTime(isPerfect ? 0.2 : 0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + (isPerfect ? 0.6 : 0.25));

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + (isPerfect ? 0.62 : 0.26));

        // Overhang slice chime if perfect
        if (isPerfect) {
          const osc2 = this.ctx.createOscillator();
          const gain2 = this.ctx.createGain();
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(freq * 2, now + 0.05);
          gain2.gain.setValueAtTime(0.12, now + 0.05);
          gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
          osc2.connect(gain2);
          gain2.connect(this.ctx.destination);
          osc2.start(now + 0.05);
          osc2.stop(now + 0.47);
        }
      }

      playFallThud() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.35);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.001, now + 0.35);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.36);
      }

      toggleMute() {
        this.muted = !this.muted;
        try { localStorage.setItem('towerStackMuted', this.muted ? '1' : '0'); } catch (_) {}
        return this.muted;
      }
    }

    const sound = new StackAudio();

    // --- Canvas & Entities ---
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('scoreEl');
    const perfectBanner = document.getElementById('perfectBanner');
    const soundBtn = document.getElementById('soundBtn');
    const startModal = document.getElementById('startModal');
    const endModal = document.getElementById('endModal');
    const startBtn = document.getElementById('startBtn');
    const retryBtn = document.getElementById('retryBtn');

    let W = 400;
    let H = 600;
    let dpr = 1;

    let isPlaying = false;
    let isGameOver = false;

    let score = 0;
    let bestScore = 0;
    let perfectCount = 0;
    let comboStreak = 0;
    let maxStreak = 0;

    try {
      bestScore = Number(localStorage.getItem('towerStackBest') || 0);
      document.getElementById('startBest').textContent = bestScore;
    } catch (_) {}

    // Tower Blocks
    const BLOCK_HEIGHT = 28;
    let stack = [];
    let debris = [];
    let particles = [];
    let cameraY = 0;
    let targetCameraY = 0;

    // Moving current slab
    let currentBlock = {
      x: 0,
      y: 0,
      width: 220,
      speed: 190,
      dir: 1
    };

    function getColorForTier(tier) {
      const hue = (tier * 14 + 180) % 360;
      return `hsl(${hue}, 85%, 62%)`;
    }

    function resize() {
      const container = document.getElementById('game-container');
      dpr = window.devicePixelRatio || 1;
      W = container.clientWidth;
      H = container.clientHeight;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resize);

    // --- Place Block Action ---
    function placeBlock() {
      if (!isPlaying || isGameOver) return;

      const top = stack[stack.length - 1];
      const cur = currentBlock;
      const diff = cur.x - top.x;

      // Check for Miss (complete drop off)
      if (Math.abs(diff) >= cur.width) {
        // Complete Miss -> Game Over
        debris.push({
          x: cur.x,
          y: cur.y,
          width: cur.width,
          height: BLOCK_HEIGHT,
          color: getColorForTier(stack.length),
          vy: 60,
          vRot: (cur.dir > 0 ? 3 : -3)
        });
        sound.playFallThud();
        triggerGameOver();
        return;
      }

      // Check for Perfect Placement (within 4 pixels)
      let isPerfect = Math.abs(diff) <= 4;
      let newWidth = cur.width - Math.abs(diff);
      let newX = diff > 0 ? cur.x : top.x;

      if (isPerfect) {
        newWidth = cur.width;
        newX = top.x; // snap to exact alignment
        comboStreak++;
        perfectCount++;
        maxStreak = Math.max(maxStreak, comboStreak);

        perfectBanner.textContent = `HOÀN HẢO! x${comboStreak} 🔥`;
        perfectBanner.classList.add('show');
        setTimeout(() => perfectBanner.classList.remove('show'), 700);

        // Expand slab slightly on streak >= 4
        if (comboStreak >= 4) {
          newWidth = Math.min(240, newWidth + 12);
        }

        // Particle sparks
        for (let i = 0; i < 16; i++) {
          const a = Math.random() * Math.PI * 2;
          particles.push({
            x: newX + Math.random() * newWidth,
            y: cur.y + BLOCK_HEIGHT / 2,
            vx: Math.cos(a) * 120,
            vy: Math.sin(a) * 120,
            color: '#ffd257',
            r: 2,
            life: 0.4
          });
        }
      } else {
        comboStreak = 0;
        perfectBanner.classList.remove('show');

        // Sliced off debris
        const debrisW = Math.abs(diff);
        const debrisX = diff > 0 ? (newX + newWidth) : cur.x;
        debris.push({
          x: debrisX,
          y: cur.y,
          width: debrisW,
          height: BLOCK_HEIGHT,
          color: getColorForTier(stack.length),
          vy: 80,
          vRot: (diff > 0 ? 4 : -4)
        });
      }

      sound.playStackChime(stack.length, isPerfect);

      // Add to stack
      stack.push({
        x: newX,
        y: cur.y,
        width: newWidth,
        color: getColorForTier(stack.length)
      });

      score++;
      scoreEl.textContent = score;

      // Spawn next moving block
      const nextY = cur.y - BLOCK_HEIGHT;
      const speed = Math.min(380, 190 + score * 4);
      currentBlock = {
        x: (score % 2 === 0) ? -newWidth : W,
        y: nextY,
        width: newWidth,
        speed,
        dir: (score % 2 === 0) ? 1 : -1
      };

      // Camera glide
      targetCameraY = Math.max(0, (stack.length - 6) * BLOCK_HEIGHT);
    }

    // --- Game Over ---
    function triggerGameOver() {
      isGameOver = true;
      isPlaying = false;

      const newBestLabel = document.getElementById('newBestLabel');
      if (score > bestScore) {
        bestScore = score;
        try { localStorage.setItem('towerStackBest', String(bestScore)); } catch (_) {}
        newBestLabel.textContent = '🔥 KỶ LỤC TẦNG MỚI CỦA BẠN!';
      } else {
        newBestLabel.textContent = '';
      }

      document.getElementById('endScore').textContent = score;
      document.getElementById('endBest').textContent = bestScore;
      document.getElementById('endPerfects').textContent = perfectCount;
      document.getElementById('endMaxStreak').textContent = `x${maxStreak}`;

      endModal.classList.remove('hidden');
    }

    // --- Reset Game ---
    function resetGame() {
      score = 0;
      perfectCount = 0;
      comboStreak = 0;
      maxStreak = 0;
      debris = [];
      particles = [];
      cameraY = 0;
      targetCameraY = 0;

      scoreEl.textContent = '0';
      perfectBanner.classList.remove('show');

      const baseWidth = Math.min(220, W * 0.55);
      const baseY = H - 120;

      stack = [
        { x: (W - baseWidth) / 2, y: baseY, width: baseWidth, color: getColorForTier(0) }
      ];

      currentBlock = {
        x: -baseWidth,
        y: baseY - BLOCK_HEIGHT,
        width: baseWidth,
        speed: 190,
        dir: 1
      };

      isPlaying = true;
      isGameOver = false;

      startModal.classList.add('hidden');
      endModal.classList.add('hidden');
    }

    // --- Input Handlers ---
    canvas.addEventListener('pointerdown', (e) => {
      sound.init();
      placeBlock();
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === ' ' || e.key === 'Enter') {
        sound.init();
        placeBlock();
      }
    });

    startBtn.addEventListener('click', () => { sound.init(); resetGame(); });
    retryBtn.addEventListener('click', () => { sound.init(); resetGame(); });

    soundBtn.addEventListener('click', () => {
      const isMuted = sound.toggleMute();
      soundBtn.textContent = isMuted ? '🔇' : '🔊';
    });
    if (sound.muted) soundBtn.textContent = '🔇';

    // --- Main Loop ---
    let lastTime = performance.now();

    function update(now) {
      const dt = Math.min(0.04, (now - lastTime) / 1000);
      lastTime = now;

      // Smooth Camera follow
      cameraY += (targetCameraY - cameraY) * 0.12;

      // Update Moving Current Block
      if (isPlaying && !isGameOver) {
        currentBlock.x += currentBlock.speed * currentBlock.dir * dt;
        if (currentBlock.dir > 0 && currentBlock.x > W - 20) {
          currentBlock.dir = -1;
        } else if (currentBlock.dir < 0 && currentBlock.x < -currentBlock.width + 20) {
          currentBlock.dir = 1;
        }
      }

      // Update Debris falling
      for (let i = debris.length - 1; i >= 0; i--) {
        const d = debris[i];
        d.vy += 850 * dt;
        d.y += d.vy * dt;
        if (d.y - cameraY > H + 100) debris.splice(i, 1);
      }

      // Update Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life -= dt;
        if (p.life <= 0) { particles.splice(i, 1); continue; }
        p.x += p.vx * dt;
        p.y += p.vy * dt;
      }

      // --- Draw Scene ---
      ctx.clearRect(0, 0, W, H);

      // Gradient Sky
      const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
      const topHue = (score * 8 + 220) % 360;
      skyGrad.addColorStop(0, `hsl(${topHue}, 40%, 8%)`);
      skyGrad.addColorStop(1, '#050814');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, W, H);

      ctx.save();
      ctx.translate(0, cameraY);

      // 1. Draw Tower Stack
      for (let i = 0; i < stack.length; i++) {
        const blk = stack[i];
        ctx.save();
        ctx.fillStyle = blk.color;
        ctx.shadowColor = blk.color;
        ctx.shadowBlur = 10;
        ctx.fillRect(blk.x, blk.y, blk.width, BLOCK_HEIGHT);

        // Top edge reflection highlight
        ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
        ctx.fillRect(blk.x, blk.y, blk.width, 3);
        ctx.restore();
      }

      // 2. Draw Moving Block
      if (isPlaying && !isGameOver) {
        ctx.save();
        const curCol = getColorForTier(stack.length);
        ctx.fillStyle = curCol;
        ctx.shadowColor = curCol;
        ctx.shadowBlur = 16;
        ctx.fillRect(currentBlock.x, currentBlock.y, currentBlock.width, BLOCK_HEIGHT);

        ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.fillRect(currentBlock.x, currentBlock.y, currentBlock.width, 3);
        ctx.restore();
      }

      // 3. Draw Sliced Debris
      for (let i = 0; i < debris.length; i++) {
        const d = debris[i];
        ctx.save();
        ctx.fillStyle = d.color;
        ctx.fillRect(d.x, d.y, d.width, d.height);
        ctx.restore();
      }

      // 4. Draw Particles
      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        ctx.save();
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      ctx.restore();

      requestAnimationFrame(update);
    }

    resize();
    requestAnimationFrame(update);
  })();
  </script>
</body>
</html>
