<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Drift Catcher</title>
<style>
  :root { --safe-top: env(safe-area-inset-top); --safe-bottom: env(safe-area-inset-bottom); }
  * { box-sizing: border-box; }
  html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#8ec9df; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  body { display:grid; place-items:center; }
  #game { position:relative; width:100vw; height:100dvh; max-width:1200px; max-height:900px; overflow:hidden; }
  canvas { display:block; width:100%; height:100%; touch-action:none; }
  .screen { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:24px; padding-top:calc(24px + var(--safe-top)); padding-bottom:calc(24px + var(--safe-bottom)); pointer-events:auto; }
  .panel { width:min(560px, 92vw); text-align:center; color:#fff; text-shadow:0 2px 14px rgba(44,52,85,.18); }
  h1 { margin:0 0 8px; font-size:clamp(42px,8vw,76px); line-height:1; letter-spacing:-.045em; }
  .subtitle { margin:0 auto 24px; max-width:480px; font-size:clamp(15px,2.5vw,19px); line-height:1.55; opacity:.94; }
  .hint { margin:18px 0 0; font-size:13px; opacity:.82; line-height:1.6; }
  button { border:0; border-radius:999px; padding:15px 30px; font-size:17px; font-weight:800; color:#4c416d; background:rgba(255,255,255,.92); box-shadow:0 12px 32px rgba(65,58,104,.18); cursor:pointer; transition:transform .15s, box-shadow .15s; }
  button:hover { transform:translateY(-2px); box-shadow:0 15px 36px rgba(65,58,104,.24); }
  button:active { transform:translateY(1px); }
  .hud { position:absolute; inset:0; pointer-events:none; padding:calc(18px + var(--safe-top)) 18px calc(18px + var(--safe-bottom)); }
  .pill { position:absolute; top:calc(18px + var(--safe-top)); min-width:112px; padding:9px 14px; border-radius:999px; background:rgba(255,255,255,.28); border:1px solid rgba(255,255,255,.36); backdrop-filter:blur(10px); color:white; box-shadow:0 8px 25px rgba(47,60,90,.10); }
  .score { left:18px; } .best { right:18px; text-align:right; }
  .label { display:block; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.12em; opacity:.76; }
  .value { font-size:22px; font-weight:900; line-height:1.05; }
  #combo { position:absolute; left:50%; top:calc(22px + var(--safe-top)); transform:translateX(-50%) translateY(-8px) scale(.92); opacity:0; padding:8px 17px; border-radius:999px; color:#fff; background:rgba(118,89,166,.76); backdrop-filter:blur(8px); font-weight:900; transition:opacity .18s, transform .18s; }
  #combo.show { opacity:1; transform:translateX(-50%) translateY(0) scale(1); }
  .end-score { font-size:clamp(58px,13vw,100px); font-weight:950; line-height:1; margin:10px 0; }
  .bestline { min-height:26px; font-weight:800; color:#fff5bc; }
  .small { margin-top:18px; font-size:13px; opacity:.75; }
  .hidden { display:none !important; }
  #milestone { position:absolute; left:50%; top:47%; transform:translate(-50%,-50%); color:white; font-weight:900; font-size:clamp(22px,5vw,38px); text-align:center; white-space:nowrap; text-shadow:0 3px 20px rgba(65,55,105,.25); opacity:0; pointer-events:none; }
  @keyframes floatUp { 0%{opacity:0;transform:translate(-50%,8px) scale(.94)} 15%{opacity:1} 75%{opacity:1} 100%{opacity:0;transform:translate(-50%,-38px) scale(1.03)} }
  #milestone.animate { animation:floatUp 1.6s ease-out both; }
</style>
</head>
<body>
<div id="game">
  <canvas id="canvas"></canvas>

  <div id="start" class="screen">
    <div class="panel">
      <h1>Drift Catcher</h1>
      <p class="subtitle">Thư giãn một chút — lướt qua bầu trời, bắt những vì sao và tránh những đám mây.</p>
      <button id="startBtn">Bắt đầu chơi</button>
      <p class="hint">← → / A D để di chuyển<br>Trên mobile: kéo hoặc chạm để đặt vị trí</p>
    </div>
  </div>

  <div id="gameHud" class="hud hidden">
    <div class="pill score"><span class="label">Điểm</span><span id="score" class="value">0</span></div>
    <div class="pill best"><span class="label">Kỷ lục</span><span id="best" class="value">0</span></div>
    <div id="combo">Combo x2!</div>
  </div>

  <div id="milestone"></div>

  <div id="end" class="screen hidden">
    <div class="panel">
      <div class="small">Phiêu lưu kết thúc nhẹ nhàng</div>
      <div id="finalScore" class="end-score">0</div>
      <div id="bestLine" class="bestline"></div>
      <button id="retryBtn">Chơi lại</button>
      <div class="small">Mỗi lượt kéo dài khoảng 90 giây.</div>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  const gameEl = document.getElementById("game");
  const startEl = document.getElementById("start");
  const endEl = document.getElementById("end");
  const hudEl = document.getElementById("gameHud");
  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const comboEl = document.getElementById("combo");
  const milestoneEl = document.getElementById("milestone");
  const finalScoreEl = document.getElementById("finalScore");
  const bestLineEl = document.getElementById("bestLine");

  const DURATION = 90;
  const MILESTONES = [100, 250, 500, 1000, 2000];
  const stageColors = [
    ["#79c7df","#f7c7ad","#f6d6bd"], // sunset/day
    ["#6ea4cb","#9e91bd","#e8b8b4"], // dusk
    ["#403d78","#625a98","#b17cb3"], // night
    ["#82b9c7","#f0bf91","#ffe09b"]  // dawn
  ];

  let W = 800, H = 600, dpr = 1;
  let raf = 0, lastTime = 0;
  let state = null;
  let bestScore = Number(sessionStorage.getItem("driftCatcherBest") || 0);

  function resize() {
    const r = gameEl.getBoundingClientRect();
    W = Math.max(320, r.width);
    H = Math.max(420, r.height);
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  window.addEventListener("resize", resize, {passive:true});
  resize();
  bestEl.textContent = bestScore;

  const clamp = (v,a,b) => Math.max(a, Math.min(b,v));
  const rand = (a,b) => a + Math.random()*(b-a);
  const ease = (a,b,t) => a + (b-a)*t;

  function resetState() {
    state = {
      running:true, elapsed:0, score:0, combo:0, multiplier:1,
      speedMul:1, spawnTimer:.35, passiveTimer:0,
      shake:0, stage:0, nextMilestone:0,
      player:{x:W/2, targetX:W/2, y:H-72, vx:0, knock:0, shield:0},
      objects:[], particles:[], texts:[], starsCaught:0,
      keys:{left:false,right:false}
    };
  }

  function startGame() {
    resetState();
    startEl.classList.add("hidden");
    endEl.classList.add("hidden");
    hudEl.classList.remove("hidden");
    scoreEl.textContent = "0";
    bestEl.textContent = bestScore;
    comboEl.classList.remove("show");
    milestoneEl.className = "";
    lastTime = performance.now();
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(loop);
  }

  function endGame() {
    if (!state || !state.running) return;
    state.running = false;
    finalScoreEl.textContent = Math.max(0, Math.floor(state.score)).toLocaleString("vi-VN");
    const final = Math.max(0, Math.floor(state.score));
    if (final > bestScore) {
      bestScore = final;
      sessionStorage.setItem("driftCatcherBest", String(bestScore));
      bestLineEl.textContent = "✨ Kỷ lục mới!";
    } else {
      bestLineEl.textContent = `Kỷ lục: ${bestScore.toLocaleString("vi-VN")} điểm`;
    }
    hudEl.classList.add("hidden");
    endEl.classList.remove("hidden");
  }

  function setTarget(clientX) {
    const r = canvas.getBoundingClientRect();
    const x = clientX - r.left;
    state.player.targetX = clamp(x, 28, W-28);
  }

  function pointerDown(e) {
    if (!state || !state.running) return;
    setTarget(e.clientX);
    canvas.setPointerCapture?.(e.pointerId);
  }
  function pointerMove(e) {
    if (!state || !state.running) return;
    if (e.buttons || e.pointerType === "touch") setTarget(e.clientX);
  }
  canvas.addEventListener("pointerdown", pointerDown);
  canvas.addEventListener("pointermove", pointerMove);
  canvas.addEventListener("pointerup", e => { try { canvas.releasePointerCapture(e.pointerId); } catch(_){} });

  window.addEventListener("keydown", e => {
    if (!state || !state.running) return;
    if (["ArrowLeft","ArrowRight","a","d","A","D"].includes(e.key)) e.preventDefault();
    if (e.key==="ArrowLeft" || e.key==="a" || e.key==="A") state.keys.left=true;
    if (e.key==="ArrowRight" || e.key==="d" || e.key==="D") state.keys.right=true;
  });
  window.addEventListener("keyup", e => {
    if (!state) return;
    if (e.key==="ArrowLeft" || e.key==="a" || e.key==="A") state.keys.left=false;
    if (e.key==="ArrowRight" || e.key==="d" || e.key==="D") state.keys.right=false;
  });

  function spawn() {
    const r = Math.random();
    let type = r < .56 ? "star" : r < .62 ? "crystal" : r < .70 ? "gold" : "cloud";
    const radius = type==="cloud" ? rand(25,39) : type==="gold" ? 15 : type==="crystal" ? 14 : 13;
    state.objects.push({
      type, x:rand(35,W-35), y:-radius-10, r:radius,
      speed:rand(135,195)*state.speedMul,
      rot:rand(0,Math.PI*2), spin:rand(-.8,.8),
      wobble:rand(0,Math.PI*2)
    });
  }

  function addParticles(x,y,type,count=12) {
    for(let i=0;i<count;i++){
      const a=rand(0,Math.PI*2), s=rand(35,155);
      state.particles.push({
        x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
        life:rand(.35,.75), max:.75, size:rand(2,5),
        type
      });
    }
  }

  function addText(x,y,text,type="normal") {
    state.texts.push({x,y,text,life:1,max:1,type});
  }

  function catchObject(o) {
    if (o.type === "cloud") {
      if (state.player.shield > 0) {
        addParticles(o.x,o.y,"shield",14);
        addText(o.x,o.y-10,"BLOCK!","shield");
        return;
      }
      state.score = Math.max(0, state.score - 15);
      state.combo = 0;
      state.multiplier = 1;
      state.player.knock = .38;
      state.shake = .24;
      addParticles(o.x,o.y,"cloud",18);
      addText(o.x,o.y-10,"−15","bad");
      flashCombo("Combo reset");
      return;
    }

    let base = o.type==="gold" ? 50 : o.type==="crystal" ? 20 : 10;
    const points = base * state.multiplier;
    state.score += points;
    state.combo++;
    state.starsCaught++;
    addParticles(o.x,o.y,o.type, o.type==="gold"?24:15);
    addText(o.x,o.y-12,`+${points}`,"good");

    const newMultiplier = Math.min(4, 1 + Math.floor(state.combo/5));
    if (newMultiplier > state.multiplier) {
      state.multiplier = newMultiplier;
      flashCombo(`Combo x${newMultiplier}!`);
      addParticles(state.player.x,state.player.y,"combo",18);
    }

    if (o.type === "crystal") {
      state.player.shield = 4;
      addText(o.x,o.y-35,"SHIELD 4s","shield");
    }
    checkMilestone();
  }

  function flashCombo(text) {
    comboEl.textContent = text;
    comboEl.classList.remove("show");
    void comboEl.offsetWidth;
    comboEl.classList.add("show");
    clearTimeout(flashCombo.timer);
    flashCombo.timer = setTimeout(()=>comboEl.classList.remove("show"),1000);
  }

  function checkMilestone() {
    while (state.nextMilestone < MILESTONES.length && state.score >= MILESTONES[state.nextMilestone]) {
      const m = MILESTONES[state.nextMilestone++];
      state.stage = Math.min(3, Math.floor((state.nextMilestone-1)/2));
      milestoneEl.textContent = `Tuyệt vời! ${m.toLocaleString("vi-VN")} điểm`;
      milestoneEl.className = "";
      void milestoneEl.offsetWidth;
      milestoneEl.className = "animate";
    }
  }

  function update(dt) {
    state.elapsed += dt;
    const progress = clamp(state.elapsed/DURATION,0,1);

    // Gentle ramp: never frantic.
    state.speedMul = 1 + 1.1 * Math.pow(progress, 1.55);
    const spawnInterval = ease(.72,.34,Math.pow(progress,.8));
    state.spawnTimer -= dt;
    if (state.spawnTimer <= 0) {
      spawn();
      state.spawnTimer += spawnInterval * rand(.82,1.18);
    }

    const p = state.player;
    if (state.keys.left) p.targetX -= 390*dt;
    if (state.keys.right) p.targetX += 390*dt;
    p.targetX = clamp(p.targetX, 28, W-28);

    const lerpFactor = 1 - Math.pow(.0008, dt);
    p.x += (p.targetX-p.x)*lerpFactor;
    if (p.knock > 0) {
      p.knock -= dt;
      p.x += (p.x < W/2 ? -1 : 1) * 95 * dt;
    }
    p.x = clamp(p.x,28,W-28);
    p.y = H-72;
    if (p.shield > 0) p.shield -= dt;

    // Passive drip keeps the score gently moving.
    state.passiveTimer += dt;
    if (state.passiveTimer >= .5) {
      const ticks = Math.floor(state.passiveTimer/.5);
      state.passiveTimer -= ticks*.5;
      state.score += ticks * .5 * state.speedMul;
      checkMilestone();
    }

    for (let i=state.objects.length-1;i>=0;i--) {
      const o=state.objects[i];
      o.y += o.speed*dt;
      o.rot += o.spin*dt;
      o.wobble += dt*2;
      if (o.type==="cloud") o.x += Math.sin(o.wobble)*8*dt;

      const dx=o.x-p.x, dy=o.y-p.y;
      const hitDist = o.type==="cloud" ? o.r*.72+18 : o.r+17;
      if (dx*dx+dy*dy < hitDist*hitDist) {
        catchObject(o);
        state.objects.splice(i,1);
        continue;
      }
      if (o.y-o.r > H) {
        if (o.type!=="cloud") {
          state.combo=0; state.multiplier=1;
        }
        state.objects.splice(i,1);
      }
    }

    for(let i=state.particles.length-1;i>=0;i--){
      const q=state.particles[i];
      q.life-=dt; q.x+=q.vx*dt; q.y+=q.vy*dt;
      q.vx*=Math.pow(.04,dt); q.vy=q.vy*.96*dt + q.vy*.96;
      if(q.life<=0) state.particles.splice(i,1);
    }
    for(let i=state.texts.length-1;i>=0;i--){
      const t=state.texts[i]; t.life-=dt; t.y-=28*dt;
      if(t.life<=0) state.texts.splice(i,1);
    }

    state.shake = Math.max(0,state.shake-dt);
    scoreEl.textContent = Math.floor(state.score).toLocaleString("vi-VN");

    if (state.elapsed >= DURATION) endGame();
  }

  function drawBackground() {
    const c = stageColors[state.stage];
    const t = (Math.sin(state.elapsed*.08)+1)/2;
    const g=ctx.createLinearGradient(0,0,W,H);
    g.addColorStop(0,c[0]); g.addColorStop(.55,c[1]); g.addColorStop(1,c[2]);
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

    // soft atmospheric circles
    ctx.globalAlpha=.13;
    ctx.fillStyle="#fff";
    for(let i=0;i<5;i++){
      const x=(i*193 + state.elapsed*4)%(W+180)-90;
      const y=90+i*120;
      ctx.beginPath(); ctx.arc(x,y,70+i*13,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;

    // horizon glow
    const h=ctx.createRadialGradient(W*.5,H*.85,10,W*.5,H*.85,Math.max(W,H)*.55);
    h.addColorStop(0,"rgba(255,245,210,.20)");
    h.addColorStop(1,"rgba(255,255,255,0)");
    ctx.fillStyle=h; ctx.fillRect(0,0,W,H);
  }

  function starPath(x,y,r,rot=0) {
    ctx.beginPath();
    for(let i=0;i<10;i++){
      const rr=i%2===0?r:r*.43, a=rot-Math.PI/2+i*Math.PI/5;
      const px=x+Math.cos(a)*rr, py=y+Math.sin(a)*rr;
      i?ctx.lineTo(px,py):ctx.moveTo(px,py);
    }
    ctx.closePath();
  }

  function drawStar(o) {
    const colors={star:"#fff5d8",crystal:"#c8a7ff",gold:"#ffe18b"};
    ctx.save();
    ctx.translate(o.x,o.y); ctx.rotate(o.rot);
    ctx.shadowBlur=o.type==="gold"?22:15;
    ctx.shadowColor=colors[o.type];
    ctx.fillStyle=colors[o.type];
    starPath(0,0,o.r,0);
    ctx.fill();
    if(o.type==="crystal"){
      ctx.globalAlpha=.55; ctx.fillStyle="#8f64d9";
      starPath(0,0,o.r*.45,0); ctx.fill();
    }
    if(o.type==="gold"){
      ctx.globalAlpha=.55; ctx.fillStyle="#fff";
      starPath(0,0,o.r*.42,0); ctx.fill();
    }
    ctx.restore();
  }

  function drawCloud(o) {
    ctx.save();
    ctx.translate(o.x,o.y);
    ctx.globalAlpha=.78;
    ctx.shadowBlur=14; ctx.shadowColor="rgba(255,255,255,.45)";
    const parts=[
      [-.60, .12,.45],[-.28,-.12,.55],[.08,-.22,.64],[.43,.02,.52],[.68,.15,.34],
      [-.42,.28,.48],[.05,.27,.58],[.48,.29,.43]
    ];
    ctx.fillStyle="#f8fbff";
    for(const [x,y,r] of parts){ctx.beginPath();ctx.arc(x*o.r,y*o.r,r*o.r,0,Math.PI*2);ctx.fill();}
    ctx.restore();
  }

  function drawPlayer() {
    const p=state.player;
    ctx.save();
    ctx.translate(p.x,p.y);
    const shield=p.shield>0;
    const r=19;
    const glow=ctx.createRadialGradient(0,0,2,0,0,42);
    if(shield){
      glow.addColorStop(0,"rgba(225,207,255,.98)");
      glow.addColorStop(.35,"rgba(178,139,255,.72)");
      glow.addColorStop(1,"rgba(155,121,235,0)");
    } else {
      glow.addColorStop(0,"rgba(255,250,231,.98)");
      glow.addColorStop(.35,"rgba(255,220,205,.72)");
      glow.addColorStop(1,"rgba(255,190,185,0)");
    }
    ctx.fillStyle=glow; ctx.beginPath();ctx.arc(0,0,43,0,Math.PI*2);ctx.fill();

    if(shield){
      ctx.strokeStyle="rgba(224,207,255,.9)";ctx.lineWidth=3;
      ctx.shadowBlur=16;ctx.shadowColor="#c6a5ff";
      ctx.beginPath();ctx.arc(0,0,29+Math.sin(state.elapsed*5)*2,0,Math.PI*2);ctx.stroke();
    }
    const orb=ctx.createRadialGradient(-6,-8,2,0,0,r);
    orb.addColorStop(0,shield?"#fffaff":"#fffef2");
    orb.addColorStop(.5,shield?"#bda0ff":"#ffd8cf");
    orb.addColorStop(1,shield?"#7655b4":"#eea8a7");
    ctx.fillStyle=orb;ctx.shadowBlur=14;ctx.shadowColor=shield?"#a987ff":"#ffc3bb";
    ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }

  function draw() {
    ctx.save();
    if(state.shake>0){
      const s=state.shake*20;
      ctx.translate(rand(-s,s),rand(-s,s));
    }
    drawBackground();

    for(const o of state.objects) o.type==="cloud" ? drawCloud(o) : drawStar(o);
    drawPlayer();

    for(const q of state.particles){
      ctx.globalAlpha=clamp(q.life/q.max,0,1);
      ctx.fillStyle=q.type==="bad"?"#fff":q.type==="crystal"||q.type==="shield"||q.type==="combo"?"#e1cfff":"#fff0b4";
      ctx.beginPath();ctx.arc(q.x,q.y,q.size,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;

    for(const t of state.texts){
      ctx.globalAlpha=clamp(t.life/t.max,0,1);
      ctx.font=`900 ${t.type==="shield"?13:17}px system-ui`;
      ctx.textAlign="center";
      ctx.fillStyle=t.type==="bad"?"#fff":t.type==="shield"?"#eadcff":"#fff8ca";
      ctx.shadowBlur=10;ctx.shadowColor="rgba(70,55,100,.25)";
      ctx.fillText(t.text,t.x,t.y);
    }
    ctx.restore();
  }

  function loop(now) {
    if(!state) return;
    const dt=Math.min(.033,Math.max(.001,(now-lastTime)/1000));
    lastTime=now;
    if(state.running){
      update(dt);
      draw();
      raf=requestAnimationFrame(loop);
    } else {
      draw();
    }
  }

  document.getElementById("startBtn").addEventListener("click", startGame);
  document.getElementById("retryBtn").addEventListener("click", startGame);

  // Idle background before first play.
  state = {
    running:false, elapsed:0, score:0, combo:0, multiplier:1, speedMul:1,
    spawnTimer:0, passiveTimer:0, shake:0, stage:0,
    player:{x:W/2,targetX:W/2,y:H-72,vx:0,knock:0,shield:0},
    objects:[],particles:[],texts:[],keys:{left:false,right:false}
  };
  draw();
})();
</script>
</body>
</html>
